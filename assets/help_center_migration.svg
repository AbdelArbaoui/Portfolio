<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu du projet SecureDrive et TeamChat Help Center Migration</title>
  <desc id="desc">Planche de quatre interfaces synthétiques et anonymisées pour un projet de migration de centre d'aide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="0.55" stop-color="#10172a"/>
      <stop offset="1" stop-color="#07151b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d5ff"/>
      <stop offset="1" stop-color="#9bf5d0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e8cff"/>
      <stop offset="1" stop-color="#d78cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .title { fill: #f5f7fb; font-weight: 750; letter-spacing: -1.8px; }
      .muted { fill: #9aa6bc; }
      .line { stroke: #26324b; stroke-width: 1; }
      .panel { fill: #111a2d; stroke: #2a3852; stroke-width: 1; }
      .inner { fill: #0c1424; stroke: #25334c; stroke-width: 1; }
      .cyan { fill: #67e5ff; }
      .green { fill: #8cebc3; }
      .violet { fill: #bdadff; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="1800" height="1260" fill="url(#bg)"/>
  <circle cx="1500" cy="30" r="260" fill="#1e6b87" opacity="0.18" filter="url(#soft)"/>
  <circle cx="150" cy="1150" r="220" fill="#594696" opacity="0.16" filter="url(#soft)"/>

  <g class="sans">
    <text x="70" y="76" class="label cyan">CASE STUDY · 04 / ANONYMISÉ</text>
    <text x="70" y="132" class="title" font-size="44">SecureDrive &amp; TeamChat</text>
    <text x="70" y="174" class="muted" font-size="22">Help center migration · aperçu des interfaces du POC</text>
    <rect x="1370" y="72" width="350" height="64" rx="32" fill="#12283a" stroke="#2e7e8e"/>
    <text x="1545" y="100" text-anchor="middle" class="label green">ESTIMATION DE PÉRIMÈTRE</text>
    <text x="1545" y="124" text-anchor="middle" fill="#f4fffb" font-size="22" font-weight="750">≈ 4 000 € / an</text>
    <text x="70" y="214" class="muted" font-size="14">Interfaces reconstituées · données métier, logos et URLs opérationnelles exclus</text>

    <!-- Navigation screen -->
    <g filter="url(#shadow)">
      <rect x="60" y="250" width="830" height="430" rx="24" class="panel"/>
      <rect x="60" y="250" width="830" height="52" rx="24" fill="#16223a"/>
      <rect x="60" y="278" width="830" height="24" fill="#16223a"/>
      <circle cx="89" cy="276" r="6" fill="#ff789b"/><circle cx="110" cy="276" r="6" fill="#f4cd68"/><circle cx="131" cy="276" r="6" fill="#62dfb0"/>
      <rect x="171" y="266" width="138" height="20" rx="10" fill="#253654"/>
      <text x="186" y="280" class="tiny muted">HELP CENTER</text>
      <text x="84" y="340" class="label cyan">01 · NAVIGATION</text>
      <text x="84" y="372" class="title" font-size="25">Find the right answer</text>
      <rect x="84" y="394" width="210" height="248" rx="14" class="inner"/>
      <text x="106" y="425" class="small" fill="#f2f5fb" font-weight="700">Help Center</text>
      <rect x="104" y="443" width="166" height="32" rx="8" fill="#16394b" stroke="#2d8799"/>
      <circle cx="121" cy="459" r="6" fill="none" stroke="#70e9ff" stroke-width="2"/><path d="M125 463l5 5" stroke="#70e9ff" stroke-width="2"/>
      <text x="140" y="464" class="tiny" fill="#c9f8ff">Search guides</text>
      <text x="106" y="505" class="tiny muted">GETTING STARTED</text>
      <text x="106" y="534" class="small" fill="#e7ebf5">Overview</text>
      <text x="106" y="562" class="small" fill="#e7ebf5">Guides</text>
      <text x="106" y="590" class="small" fill="#e7ebf5">Security</text>
      <text x="106" y="618" class="small" fill="#e7ebf5">FAQ</text>
      <rect x="320" y="394" width="532" height="248" rx="14" fill="#101b2d"/>
      <text x="350" y="430" class="small muted">WELCOME / DOCUMENTATION</text>
      <text x="350" y="468" class="title" font-size="24">One place for every answer.</text>
      <text x="350" y="496" class="body muted">Searchable, versioned and easy to review.</text>
      <rect x="350" y="530" width="145" height="72" rx="12" fill="#142c3d" stroke="#285a6d"/>
      <text x="368" y="557" class="small cyan" font-weight="700">START HERE</text>
      <text x="368" y="581" class="tiny" fill="#e8f5fa">First steps</text>
      <rect x="510" y="530" width="145" height="72" rx="12" fill="#1d1d3c" stroke="#4b4a79"/>
      <text x="528" y="557" class="small violet" font-weight="700">PLAYBOOK</text>
      <text x="528" y="581" class="tiny" fill="#e8e5ff">Admin guide</text>
      <rect x="670" y="530" width="145" height="72" rx="12" fill="#17352e" stroke="#2e6759"/>
      <text x="688" y="557" class="small green" font-weight="700">TROUBLESHOOT</text>
      <text x="688" y="581" class="tiny" fill="#e8fff5">Common issues</text>
    </g>

    <!-- Components screen -->
    <g filter="url(#shadow)">
      <rect x="910" y="250" width="830" height="430" rx="24" class="panel"/>
      <rect x="910" y="250" width="830" height="52" rx="24" fill="#16223a"/>
      <rect x="910" y="278" width="830" height="24" fill="#16223a"/>
      <circle cx="939" cy="276" r="6" fill="#ff789b"/><circle cx="960" cy="276" r="6" fill="#f4cd68"/><circle cx="981" cy="276" r="6" fill="#62dfb0"/>
      <rect x="1021" y="266" width="178" height="20" rx="10" fill="#253654"/>
      <text x="1036" y="280" class="tiny muted">COMPONENTS</text>
      <text x="934" y="340" class="label violet">02 · COMPONENT CATALOGUE</text>
      <text x="934" y="372" class="title" font-size="25">Reusable patterns</text>
      <rect x="934" y="394" width="782" height="42" rx="10" fill="#0d1525" stroke="#273650"/>
      <rect x="946" y="402" width="96" height="26" rx="7" fill="#3a356b"/>
      <text x="994" y="420" text-anchor="middle" class="tiny" fill="#eeeaff" font-weight="700">NOTE</text>
      <text x="1082" y="420" class="tiny muted">DETAILS</text><text x="1165" y="420" class="tiny muted">TABS</text><text x="1236" y="420" class="tiny muted">MERMAID</text>
      <rect x="934" y="456" width="240" height="170" rx="14" fill="#142c3d" stroke="#285a6d"/>
      <text x="956" y="486" class="label cyan">NOTE</text>
      <text x="956" y="516" class="small" fill="#f2f7fb" font-weight="700">Keep it visible.</text>
      <text x="956" y="545" class="tiny muted">Short guidance blocks make</text><text x="956" y="565" class="tiny muted">important context scannable.</text>
      <rect x="1192" y="456" width="240" height="170" rx="14" fill="#1d1d3c" stroke="#4b4a79"/>
      <text x="1214" y="486" class="label violet">DETAILS</text>
      <path d="M1214 510h190" stroke="#6c6b9c"/><path d="M1214 528h144" stroke="#6c6b9c"/><path d="M1214 546h171" stroke="#6c6b9c"/>
      <path d="M1214 584h150" stroke="#bdadff" stroke-width="3"/><path d="M1380 578l8 6-8 6" fill="none" stroke="#bdadff" stroke-width="2"/>
      <rect x="1450" y="456" width="266" height="170" rx="14" fill="#101b2d" stroke="#2d3f5f"/>
      <text x="1472" y="486" class="label green">TABS + FLOW</text>
      <circle cx="1493" cy="530" r="11" fill="#183d48" stroke="#6be3e9"/><circle cx="1570" cy="530" r="11" fill="#273361" stroke="#aeb5ff"/><circle cx="1647" cy="530" r="11" fill="#234637" stroke="#8cebc3"/>
      <path d="M1504 530h54M1581 530h54" stroke="#7b8da6" stroke-width="2"/><path d="M1552 525l7 5-7 5M1629 525l7 5-7 5" fill="none" stroke="#7b8da6" stroke-width="2"/>
      <text x="1481" y="574" class="tiny muted">context → decision → next step</text>
    </g>

    <!-- Branching guide screen -->
    <g filter="url(#shadow)">
      <rect x="60" y="720" width="830" height="430" rx="24" class="panel"/>
      <rect x="60" y="720" width="830" height="52" rx="24" fill="#16223a"/>
      <rect x="60" y="748" width="830" height="24" fill="#16223a"/>
      <circle cx="89" cy="746" r="6" fill="#ff789b"/><circle cx="110" cy="746" r="6" fill="#f4cd68"/><circle cx="131" cy="746" r="6" fill="#62dfb0"/>
      <rect x="171" y="736" width="170" height="20" rx="10" fill="#253654"/>
      <text x="186" y="750" class="tiny muted">INTERACTIVE GUIDE</text>
      <text x="84" y="810" class="label cyan">03 · BRANCHING GUIDE</text>
      <text x="84" y="842" class="title" font-size="25">Choose your path</text>
      <rect x="84" y="868" width="782" height="10" rx="5" fill="#23314a"/><rect x="84" y="868" width="510" height="10" rx="5" fill="url(#cyan)"/>
      <text x="84" y="905" class="small muted">STEP 2 OF 3</text>
      <text x="84" y="940" class="body" fill="#f3f6fb" font-weight="700">What are you trying to do?</text>
      <rect x="84" y="968" width="228" height="72" rx="13" fill="#142c3d" stroke="#32819a"/>
      <text x="106" y="998" class="small" fill="#dcfbff" font-weight="700">Sign in</text><text x="106" y="1022" class="tiny muted">Access help</text>
      <rect x="328" y="968" width="228" height="72" rx="13" fill="#1d1d3c" stroke="#4b4a79"/>
      <text x="350" y="998" class="small" fill="#eeeaff" font-weight="700">Set up device</text><text x="350" y="1022" class="tiny muted">First connection</text>
      <rect x="572" y="968" width="228" height="72" rx="13" fill="#17352e" stroke="#2e6759"/>
      <text x="594" y="998" class="small" fill="#e8fff5" font-weight="700">Permissions</text><text x="594" y="1022" class="tiny muted">Admin path</text>
      <rect x="84" y="1070" width="782" height="48" rx="10" fill="#0c1424" stroke="#25334c"/>
      <circle cx="108" cy="1094" r="8" fill="#203b4c" stroke="#67e5ff"/><text x="130" y="1099" class="tiny muted">Static branching pattern · no account or usage data is collected.</text>
    </g>

    <!-- Outcome screen -->
    <g filter="url(#shadow)">
      <rect x="910" y="720" width="830" height="430" rx="24" class="panel"/>
      <rect x="910" y="720" width="830" height="52" rx="24" fill="#16223a"/>
      <rect x="910" y="748" width="830" height="24" fill="#16223a"/>
      <circle cx="939" cy="746" r="6" fill="#ff789b"/><circle cx="960" cy="746" r="6" fill="#f4cd68"/><circle cx="981" cy="746" r="6" fill="#62dfb0"/>
      <rect x="1021" y="736" width="165" height="20" rx="10" fill="#253654"/>
      <text x="1036" y="750" class="tiny muted">OUTCOME</text>
      <text x="934" y="810" class="label green">04 · MIGRATION OUTCOME</text>
      <text x="934" y="842" class="title" font-size="25">A lighter documentation stack</text>
      <rect x="934" y="868" width="360" height="132" rx="14" fill="#101b2d" stroke="#2d3f5f"/>
      <text x="958" y="900" class="small muted">BEFORE / HOSTED EDITOR</text>
      <text x="958" y="934" class="body" fill="#f0f3f9">Harder to version</text><text x="958" y="962" class="small muted">Scattered flows · recurring licence</text>
      <rect x="1314" y="868" width="402" height="132" rx="14" fill="#17352e" stroke="#2e6759"/>
      <text x="1338" y="900" class="small green" font-weight="700">AFTER / STATIC POC</text>
      <text x="1338" y="934" class="body" fill="#f0fff8">Versioned · searchable · reviewable</text><text x="1338" y="962" class="small muted">Markdown · Git review · static hosting</text>
      <rect x="934" y="1022" width="235" height="86" rx="14" fill="#12283a" stroke="#2e7e8e"/>
      <text x="958" y="1052" class="label cyan">ESTIMATION</text><text x="958" y="1084" fill="#f4fffb" font-size="25" font-weight="750">≈ 4 000 € / an</text>
      <rect x="1188" y="1022" width="156" height="86" rx="14" fill="#0d1525" stroke="#273650"/>
      <text x="1210" y="1052" class="label violet">VERSIONNÉ</text><text x="1210" y="1084" class="small" fill="#e8e5ff">Git + Markdown</text>
      <rect x="1362" y="1022" width="164" height="86" rx="14" fill="#0d1525" stroke="#273650"/>
      <text x="1384" y="1052" class="label green">ANONYMISÉ</text><text x="1384" y="1084" class="small" fill="#e8fff5">00 donnée métier</text>
      <rect x="1544" y="1022" width="172" height="86" rx="14" fill="#0d1525" stroke="#273650"/>
      <text x="1566" y="1052" class="label cyan">PORTFOLIO</text><text x="1566" y="1084" class="small" fill="#dcfbff">Case study public</text>
    </g>

    <text x="900" y="1210" text-anchor="middle" class="muted" font-size="14">SecureDrive et TeamChat sont des noms génériques · aucun contenu opérationnel réel n’est représenté</text>
  </g>
</svg>
